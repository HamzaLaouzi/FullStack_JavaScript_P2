<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Voluntariados - TeamScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-warning shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🤝 TeamScript</a>
      <div class="ms-auto">
        <span id="usuarioActivo" class="me-3">- no login -</span>
        <a id="loginLink" href="login.html" class="me-3">Login</a>
        <a id="logoutLink" href="#">Cerrar sesión</a>
        <a id="navVoluntarios" href="gestion-voluntariados.html" class="ms-3">Voluntariados</a>
        <a id="navUsuarios" href="gestion-usuarios.html" class="ms-3">Usuarios</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h2 class="text-success mb-3">Gestión de Voluntariados</h2>

    <!-- Alta voluntariado -->
    <div class="card p-4 mb-4 shadow">
      <h5 class="mb-3">Nuevo voluntariado</h5>
      <form id="formAltaVoluntariado">
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Fecha</label>
          <input type="date" id="fecha" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <input type="text" id="descripcion" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Tipo</label>
          <select id="tipo" class="form-select" required>
            <option value="">Selecciona...</option>
            <option value="Petición">Petición</option>
            <option value="Oferta">Oferta</option>
          </select>
        </div>
        <button class="btn btn-success w-100">Guardar</button>
      </form>
    </div>

    <!-- Tabla voluntariados -->
    <h4>Listado de voluntariados</h4>
    <div class="table-responsive mb-4">
      <table class="table table-striped">
        <thead class="table-light">
          <tr>
            <th>Título</th>
            <th>Email</th>
            <th>Fecha</th>
            <th>Descripción</th>
            <th>Tipo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaVoluntariados"></tbody>
      </table>
    </div>

    <!-- Gráfico -->
    <h4>Gráfico de voluntariados</h4>
    <canvas id="grafico" width="600" height="300" class="border shadow-sm bg-white"></canvas>
  </main>

  <footer class="text-center py-3 bg-warning-subtle text-dark">
    <small>© 2025 TeamScript</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/voluntariados.js"></script>
  
</body>
</html>
