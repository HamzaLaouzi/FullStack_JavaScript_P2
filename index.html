<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - TeamScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-warning shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🤝 TeamScript</a>
      <div class="ms-auto">
        <span id="usuarioActivo" class="me-3">- no login -</span>
        <a id="loginLink" href="login.html" class="me-3">Login</a>
        <a id="logoutLink" href="#">Cerrar sesión</a>
        <a id="navVoluntarios" href="gestion-voluntariados.html" class="ms-3">Voluntariados</a>
        <a id="navUsuarios" href="gestion-usuarios.html" class="ms-3">Usuarios</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h2 class="text-center text-success mb-4">Dashboard de Voluntariado</h2>

    <!-- Filtros -->
    <div class="text-center mb-4">
      <button id="filtroTodos" class="btn btn-secondary me-2">Todos</button>
      <button id="filtroPeticiones" class="btn btn-danger me-2">Peticiones</button>
      <button id="filtroOfertas" class="btn btn-info">Ofertas</button>
    </div>

    <div class="row">
      <!-- Tarjetas disponibles -->
      <div class="col-md-6">
        <h4>Voluntariados disponibles</h4>
        <div id="cards" class="border rounded p-3 bg-white" style="min-height:300px;"></div>
      </div>

      <!-- Selección del usuario -->
      <div class="col-md-6">
        <h4>Mi selección</h4>
        <div id="seleccion" class="border rounded p-3 bg-light" style="min-height:300px;"></div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 bg-warning-subtle text-dark">
    <small>© 2025 TeamScript</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/int_1_dashboard.js"></script>
  <script type="module" src="js/init.js"></script>
<script type="module" src="js/init-usuarios.js"></script>

</body>
</html>
