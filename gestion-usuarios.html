<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Usuarios - TeamScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-light">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-warning shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">🤝 TeamScript</a>
    <div class="ms-auto">
      <span id="usuarioActivo" class="me-3">- no login -</span>
      <a id="loginLink" href="login.html" class="me-3">Login</a>
      <a id="logoutLink" href="#">Cerrar sesión</a>
      <a id="navVoluntarios" href="gestion-voluntariados.html" class="ms-3">Voluntariados</a>
<a id="navUsuarios" href="gestion-usuarios.html" class="ms-3">Usuarios</a>

    </div>
  </div>
</nav>


  <main class="container py-4">
    <h2 class="text-success mb-3">Gestión de Usuarios</h2>

    <div class="card p-4 mb-4 shadow">
      <h5 class="mb-3">Nuevo usuario</h5>
      <form id="formAltaUsuario">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" id="nombre" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" required />
        </div>
        <button class="btn btn-success w-100">Guardar</button>
      </form>
    </div>

    <h4>Listado de usuarios</h4>
    <div class="table-responsive">
      <table class="table table-striped">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Contraseña</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaUsuarios"></tbody>
      </table>
    </div>
  </main>

  <footer class="text-center py-3 bg-warning-subtle text-dark">
    <small>© 2025 TeamScript</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/almacenaje.js"></script>
  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/usuarios.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/navbar.js"></script>
<script type="module" src="js/login.js"></script>

</body>
</html>
